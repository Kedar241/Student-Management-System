
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | StudentMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px #00000010;
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbe1ea;
            border-radius: 8px;
        }

        .helptext {
            display: block;
            color: #94a3b8;
            font-size: 11px;
            margin-top: 5px;
        }

        ul.errorlist {
            color: #dc2626;
            font-size: 12px;
            margin: 5px 0 10px 18px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 22px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        a {
            color: #4f46e5;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="auth-container">

    <h1>StudentMS.</h1>

    <p class="subtitle">Create your account</p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Account</button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="{% url 'login' %}">Login here</a>
    </div>

</div>

</body>
</html>
