
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Student Management System{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'students/css/style.css' %}">
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2 class="logo">Student<span>MS.</span></h2>

        <p class="menu-title">MAIN MENU</p>

        <a href="{% url 'home' %}" class="menu-link active">
            <span class="menu-icon">▦</span>
            Dashboard
        </a>

        <a href="{% url 'student_list' %}" class="menu-link">
            <span class="menu-icon">♙</span>
            Students
        </a>

        <a href="#" class="menu-link">
            <span class="menu-icon">▤</span>
            Courses
        </a>

        <a href="#" class="menu-link">
            <span class="menu-icon">♧</span>
            Teachers
        </a>

        <a href="#" class="menu-link">
            <span class="menu-icon">◷</span>
            Attendance
        </a>

        <a href="#" class="menu-link">
            <span class="menu-icon">▣</span>
            Results
        </a>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Topbar -->
        <header class="topbar">

            <h3>{% block page_heading %}Dashboard{% endblock %}</h3>

            <div class="admin-profile">

                <div class="profile-avatar">A</div>

                <div class="profile-info">
                    <strong>Administrator</strong>
                    <small>System Admin</small>
                </div>

            </div>

        </header>

        <!-- Page Content -->
        <section class="page-content">

            {% block content %}
            {% endblock %}

        </section>

    </main>

</div>

</body>
</html>
