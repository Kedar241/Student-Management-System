
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #212936;
            color: white;
            padding: 20px 40px;
        }

        main {
            padding: 40px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000010;
        }

        .card h3 {
            color: #555;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <header>
        <h2>Student Management System</h2>
    </header>

    <main>

        <section class="welcome">
            <h1>Welcome to Student Management System</h1>
            <p>Manage students, courses, attendance and academic results.</p>
        </section>

        <section class="cards">

            <div class="card">
                <h3>Total Students</h3>
                <p class="number">0</p>
            </div>

            <div class="card">
                <h3>Total Courses</h3>
                <p class="number">0</p>
            </div>

            <div class="card">
                <h3>Total Teachers</h3>
                <p class="number">0</p>
            </div>

            <div class="card">
                <h3>Attendance</h3>
                <p class="number">0%</p>
            </div>

        </section>

    </main>

</body>
</html>
