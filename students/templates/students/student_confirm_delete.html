
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        button {
            background: #dc2626;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            margin-left: 15px;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Delete Student</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ student.full_name }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">Yes, Delete</button>

        <a href="{% url 'student_list' %}">Cancel</a>

    </form>

</div>

</body>
</html>
