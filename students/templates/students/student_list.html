
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Students</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        a, button {
            text-decoration: none;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add {
            background: #2563eb;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #212936;
            color: white;
        }

        .edit {
            background: #eab308;
            color: black;
        }

        .delete {
            background: #dc2626;
            color: white;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .empty {
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <h1>Student Management</h1>

        <a href="{% url 'student_create' %}" class="add">
            + Add Student
        </a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for student in students %}

            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.full_name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.phone_number|default:"-" }}</td>

                <td>
                    <div class="actions">

                        <a href="{% url 'student_update' student.pk %}"
                           class="edit">
                            Edit
                        </a>

                        <a href="{% url 'student_delete' student.pk %}"
                           class="delete">
                            Delete
                        </a>

                    </div>
                </td>
            </tr>

            {% empty %}

            <tr>
                <td colspan="5" class="empty">
                    No students found. Add your first student!
                </td>
            </tr>

            {% endfor %}

        </tbody>
    </table>

    <p>
        <a href="{% url 'home' %}">Back to Dashboard</a>
    </p>

</div>

</body>
</html>
