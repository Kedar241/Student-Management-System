
{% extends 'students/base.html' %}

{% block title %}{{ title }} | StudentMS{% endblock %}

{% block page_heading %}{{ title }}{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h2>{{ title }}</h2>
        <p>Enter the teacher's information below.</p>
    </div>
</div>

<div class="form-container">

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn-primary">
                Save Teacher
            </button>

            <a href="{% url 'teacher_list' %}" class="btn-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
